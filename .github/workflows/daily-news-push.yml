name: Daily News - 抓取 & LINE 推播 & 更新 Dashboard

on:
  schedule:
    # 每天台灣時間 8:30 AM (UTC+8) = UTC 00:30
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests deep-translator

      - name: Fetch news and push to LINE
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: python scripts/fetch_and_push.py

      - name: Build index.html
        run: python scripts/build.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-report-*.html index.html
          git diff --cached --quiet || git commit -m "Auto: daily news $(date +%Y-%m-%d)"
          git push || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
