    <div class="card high">
        <h3>【SC公告】Passkeys 支援次要使用者 — 團隊成員可各自設定安全登入</h3>
        <div class="region">AE - 合規</div>
        <div class="summary">Seller Central 推出 passkeys（通行密鑰）支援次要使用者功能。每位團隊成員可綁定自己的 passkey（指紋/臉部辨識/PIN），防止釣魚攻擊並加速登入。不再支援多人共用同一登入帳號。</div>
        <div class="impact"><p>共用帳號的賣家必須為每位團隊成員建立次要使用者帳號，否則將無法使用 passkey 登入。提升帳號安全性但增加初始設定工作。</p></div>
        <div class="action"><p>前往 Settings → User Permissions 為團隊成員設定次要使用者帳號，確保每人有獨立登入方式。</p></div>
        <div class="source"><a href="https://www.sellercentral.amazon.dev/gp/headlines.html">Seller Central</a></div>
    </div>
