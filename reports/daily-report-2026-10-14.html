        <h3>凱馬特在隱私調查期間從現場拉出智能眼鏡-信息時代| ACS</h3>
        <div class="region">AU - 平台</div>
        <div class="summary">澳洲 Kmart 因面臨隱私調查，已將智慧眼鏡從其網站上下架。</div>
        <div class="impact"><p>這顯示澳洲監管機構對智慧型穿戴裝置與個資隱私的審查趨嚴，若賣家販售同類電子產品，可能面臨合規風險或產品下架的壓力。</p></div>
        <div class="action"><p>建議相關電子產品賣家立即檢視所售智慧型設備的隱私合規與認證文件，確保符合澳洲法規以避免受波及。</p></div>
