        <h3>網路上銷售的「便宜又有吸引力」的燈未通過澳洲合規測試頭條新聞 – 澳洲廣播公司</h3>
        <div class="region">AU - 政策</div>
        <div class="summary">澳洲廣播公司報導指出，網路上販售的低價且具吸引力的燈具未能通過澳洲當地的合規測試。</div>
        <div class="impact"><p>這顯示澳洲監管部門正加強對線上銷售燈具等電器產品的合規審查，不合規的商品面臨下架或處罰風險，直接影響相關類目賣家的營運安全。</p></div>
        <div class="action"><p>澳洲站賣家應立即重新檢查燈具及相關電器類產品的當地認證文件，確保符合澳洲安全與合規標準。</p></div>
